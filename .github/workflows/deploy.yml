name: Deploy to OVH

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ketohoy-production-deploy
      cancel-in-progress: false
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy isolated release
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA,DEPLOY_RUN_ID,DEPLOY_PATH,APP_DOMAIN,UNSPLASH_ACCESS_KEY,RESEND_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,PM2_APP_NAME
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/home/ubuntu/ketohoy}"
            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "$TMP_DIR"' EXIT
            git init "$TMP_DIR" >/dev/null
            git -C "$TMP_DIR" remote add origin https://github.com/sergioballesteros-vd/ketohoy.git
            git -C "$TMP_DIR" fetch --depth 1 origin "$DEPLOY_SHA"
            git -C "$TMP_DIR" checkout --force FETCH_HEAD >/dev/null
            DEPLOY_PATH="$DEPLOY_PATH" bash "$TMP_DIR/scripts/deploy-release.sh" "$TMP_DIR"
