name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tsc, seed, and test all need the generated client (src/generated/prisma) —
      # normally only `npm run build`'s `prebuild` hook generates it, and `npm ci`
      # doesn't run it implicitly here. Do it once, explicitly, before anything
      # that imports it.
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Seed a CI database
        # Must run before `npm test` — the API integration tests copy this
        # seeded db as their fixture (src/lib/__tests__/testDb.ts).
        run: |
          npx prisma migrate deploy
          npx prisma db seed
        env:
          DATABASE_URL: file:./dev.db
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DATABASE_URL: file:./dev.db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
